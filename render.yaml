# ============================================================
# RENDER BLUEPRINT: DOCUMIND AI BACKEND (FASTAPI IN DOCKER)
# Render dashboard → New → Blueprint → select this repository.
# ============================================================
services:
  - type: web
    name: documind-ai-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      # MongoDB Atlas connection string (entered in the dashboard)
      - key: MONGODB_URL
        sync: false
      - key: DATABASE_NAME
        value: documind_ai
      # Google Gemini API key (entered in the dashboard)
      - key: GEMINI_API_KEY
        sync: false
      # Random JWT signing secret generated by Render
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: VECTOR_SEARCH_ENABLED
        value: "false"
      # Deployed frontend (and local development)
      - key: CORS_ORIGINS
        value: https://documind-ai-wine.vercel.app,http://localhost:5173
      # Only this Vercel team's preview deployments
      - key: CORS_ORIGIN_REGEX
        value: https://documind-[a-z0-9-]+-espiritz-s-projects\.vercel\.app
